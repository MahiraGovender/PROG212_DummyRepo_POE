name: Validate Repository Structure

on:
  push:
  pull_request:

jobs:
  validate-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder
        run: |
          test -d docs || {
            echo "ERROR: docs folder is missing."
            exit 1
          }

      - name: Check required files
        run: |
          test -f "docs/API_Endpoint_Plan.md" || {
            echo "ERROR: API_Endpoint_Plan.md is missing."
            exit 1
          }

          test -f "docs/PROG_2B - ERD.png" || {
            echo "ERROR: PROG_2B - ERD.png is missing."
            exit 1
          }

          test -f "docs/RaceDay_DB_SQLScript.sql" || {
            echo "ERROR: RaceDay_DB_SQLScript.sql is missing."
            exit 1
          }

          test -f "README.md" || {
            echo "ERROR: README.md is missing."
            exit 1
          }

      - name: Structure validation successful
        run: |
          echo "Repository structure is valid."
          echo "All required files are present."
